services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docqa}
      POSTGRES_DB: docqa
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
